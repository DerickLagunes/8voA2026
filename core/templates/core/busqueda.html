{% extends "base.html" %}

{% block body %}
<div class="search-container">
    <input type="text" id="search-input" placeholder="Buscar en el sitio...">
    <button onclick="ejecutarBusqueda()">Buscar</button>
</div>

<div id="results-container">

</div>

    <script>
async function ejecutarBusqueda() {
    const query = document.getElementById('search-input').value;
    const apiKey = 'AIzaSyDXYjgJA7SNlUEdZ-NGDmWKINwi4HguoWI';
    const cx = '77a884ba1fcfe4683';
    const container = document.getElementById('results-container');

    if (!query) return;

    container.innerHTML = 'Buscando...';

    try {
        const response = await fetch(`https://www.googleapis.com/customsearch/v1?key=${apiKey}&cx=${cx}&q=${query}`);
        const data = await response.json();

        renderizarResultados(data.items);
    } catch (error) {
        console.error('Error:', error);
        container.innerHTML = 'Hubo un error al realizar la búsqueda.';
    }
}

function renderizarResultados(items) {
    const container = document.getElementById('results-container');
    container.innerHTML = ''; // Limpiar mensajes anteriores

    if (!items) {
        container.innerHTML = 'No se encontraron resultados.';
        return;
    }

    items.forEach(item => {
        const html = `
            <div class="result-item" style="margin-bottom: 20px;">
                <h3><a href="${item.link}">${item.title}</a></h3>
                <p>${item.snippet}</p>
                <small>${item.displayLink}</small>
            </div>
        `;
        container.insertAdjacentHTML('beforeend', html);
    });
}
</script>

{% endblock %}
